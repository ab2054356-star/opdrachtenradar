<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Radarachtergrond" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Opdrachtenradar — achtergrond</title>
  <!--
    Vectorachtergrond voor de inlogpagina. SVG in plaats van een 8K-afbeelding:
    het schaalt oneindig scherp mee (telefoon, 4K, 8K, print) en is nog geen
    5 KB groot. De kleuren staan in alpha, zodat dezelfde tekening werkt op een
    lichte én een donkere ondergrond.

    Dit is de STILLE laag: cirkels, spaken, blips en een netwerk van knooppunten.
    De draaiende veegstraal zit als kleine inline-SVG in login.html, want een SVG
    die via background-image geladen wordt, animeert niet in elke browser.
  -->
  <defs>
    <radialGradient id="gloed" cx="21%" cy="80%" r="78%">
      <stop offset="0%"   stop-color="#12897A" stop-opacity=".34"/>
      <stop offset="45%"  stop-color="#0E6E62" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0E6E62" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="warmte" cx="88%" cy="10%" r="55%">
      <stop offset="0%"   stop-color="#B4531A" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#B4531A" stop-opacity="0"/>
    </radialGradient>

    <pattern id="raster" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#4FBFAC" fill-opacity=".13"/>
    </pattern>

    <!-- Alles binnen de radar wordt afgesneden op de buitenste ring. -->
    <clipPath id="schijf">
      <circle cx="352" cy="800" r="880"/>
    </clipPath>
  </defs>

  <!-- lagen onderop: puntenraster en twee zachte lichtvlekken -->
  <rect width="1600" height="1000" fill="url(#raster)"/>
  <rect width="1600" height="1000" fill="url(#warmte)"/>
  <rect width="1600" height="1000" fill="url(#gloed)"/>

  <g clip-path="url(#schijf)">
    <!-- concentrische ringen -->
    <g fill="none" stroke="#4FBFAC" stroke-opacity=".22">
      <circle cx="352" cy="800" r="150"/>
      <circle cx="352" cy="800" r="300"/>
      <circle cx="352" cy="800" r="450"/>
      <circle cx="352" cy="800" r="600"/>
      <circle cx="352" cy="800" r="750"/>
      <circle cx="352" cy="800" r="880" stroke-opacity=".34" stroke-width="2"/>
    </g>

    <!-- spaken, elke 30 graden -->
    <g stroke="#4FBFAC" stroke-opacity=".13">
      <path d="M352 800 L1232 800"/>
      <path d="M352 800 L1114 360"/>
      <path d="M352 800 L792 38"/>
      <path d="M352 800 L352 -80"/>
      <path d="M352 800 L-88 38"/>
      <path d="M352 800 L-528 800"/>
    </g>

    <!-- blips: de dingen die de radar oppikt -->
    <g fill="#4FBFAC">
      <circle cx="596" cy="470" r="7" fill-opacity=".85"/>
      <circle cx="596" cy="470" r="20" fill="none" stroke="#4FBFAC" stroke-opacity=".35"/>
      <circle cx="838" cy="676" r="5" fill-opacity=".6"/>
      <circle cx="470" cy="266" r="4.5" fill-opacity=".5"/>
      <circle cx="188" cy="512" r="4" fill-opacity=".38"/>
    </g>
  </g>

  <!-- netwerkje rechtsboven: knooppunten en verbindingen -->
  <g stroke="#4FBFAC" stroke-opacity=".28" fill="none">
    <path d="M1180 168 L1330 96 L1466 190 L1392 330 L1226 318 Z"/>
    <path d="M1330 96 L1392 330 M1180 168 L1466 190"/>
  </g>
  <g fill="#4FBFAC" fill-opacity=".55">
    <circle cx="1180" cy="168" r="6"/>
    <circle cx="1330" cy="96"  r="6"/>
    <circle cx="1466" cy="190" r="6"/>
    <circle cx="1392" cy="330" r="6"/>
    <circle cx="1226" cy="318" r="6"/>
  </g>
</svg>
