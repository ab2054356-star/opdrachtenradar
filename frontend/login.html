<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen — Opdrachtenradar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Draaiende radarlaag. Bewust inline en niet in achtergrond.svg: een SVG die
     via CSS background-image geladen wordt, voert zijn animatie niet uit in
     Chrome. De stille laag (ringen, raster, netwerk) blijft wel een los
     bestand, want die is groter en wordt gecachet. -->
<svg class="radar" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="veeg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4FBFAC" stop-opacity=".34"/>
      <stop offset="60%"  stop-color="#4FBFAC" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#4FBFAC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7BE3CD" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#7BE3CD" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="schijf2"><circle cx="352" cy="800" r="880"/></clipPath>
  </defs>

  <g clip-path="url(#schijf2)">
    <g class="veeg">
      <path d="M352 800 L1223 678 A880 880 0 0 0 653 -27 Z" fill="url(#veeg)"/>
      <path d="M352 800 L653 -27" stroke="url(#rand)" stroke-width="2.5" fill="none"/>
    </g>

    <!-- ping: een ring die elke ronde naar buiten loopt -->
    <circle class="ping" cx="352" cy="800" r="150" fill="none" stroke="#4FBFAC" stroke-width="2"/>

    <!-- blips lichten op wanneer de straal er langs komt -->
    <g fill="#7BE3CD">
      <circle class="blip b1" cx="596" cy="470" r="7"/>
      <circle class="blip b2" cx="838" cy="676" r="5.5"/>
      <circle class="blip b3" cx="470" cy="266" r="5"/>
      <circle class="blip b4" cx="188" cy="512" r="4.5"/>
    </g>
  </g>
</svg>

<div class="loginwrap">
  <form class="logincard" id="loginform" autocomplete="on">

    <!-- Het wachtwachtertje. Kijkt je aan, en slaat zijn poten voor zijn ogen
         zodra je in het wachtwoordveld begint. Puur SVG + CSS; het script zet
         alleen een klasse op de body. -->
    <span class="wachter" aria-hidden="true">
      <svg viewBox="0 0 140 112" width="118" height="94">
        <!-- antenne -->
        <line x1="70" y1="26" x2="70" y2="12" stroke="var(--m-lijn)" stroke-width="3" stroke-linecap="round"/>
        <circle class="antenne" cx="70" cy="9" r="4.5" fill="var(--m-lijn)"/>
        <!-- oren -->
        <ellipse cx="44" cy="38" rx="9" ry="12" fill="var(--m-body)" transform="rotate(-20 44 38)"/>
        <ellipse cx="96" cy="38" rx="9" ry="12" fill="var(--m-body)" transform="rotate(20 96 38)"/>
        <!-- hoofd -->
        <circle cx="70" cy="58" r="32" fill="var(--m-body)"/>
        <ellipse cx="70" cy="63" rx="24" ry="21" fill="var(--m-gezicht)"/>
        <!-- ogen -->
        <g class="ogen">
          <circle cx="58" cy="55" r="7.5" fill="#fff"/>
          <circle cx="82" cy="55" r="7.5" fill="#fff"/>
          <circle class="pupil" cx="58" cy="56" r="3.4" fill="#12312C"/>
          <circle class="pupil" cx="82" cy="56" r="3.4" fill="#12312C"/>
        </g>
        <!-- snuitje -->
        <path d="M66 70 Q70 74 74 70" stroke="#12312C" stroke-opacity=".55" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <!-- armen: hangen omlaag, zwaaien omhoog voor de ogen -->
        <g class="arm arm-l">
          <path d="M44 76 L31 104" stroke="var(--m-body)" stroke-width="11" stroke-linecap="round" fill="none"/>
          <circle cx="31" cy="104" r="8.5" fill="var(--m-hand)"/>
        </g>
        <g class="arm arm-r">
          <path d="M96 76 L109 104" stroke="var(--m-body)" stroke-width="11" stroke-linecap="round" fill="none"/>
          <circle cx="109" cy="104" r="8.5" fill="var(--m-hand)"/>
        </g>
      </svg>
    </span>

    <span class="eyebrow">ICT N3+N4 · klas C</span>
    <h1>Opdrachtenradar</h1>
    <p class="sub" id="login-sub"></p>

    <div class="veld">
      <label for="login-gebruiker" id="lb-gebruiker"></label>
      <input type="text" id="login-gebruiker" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>

    <div class="veld">
      <label for="login-wachtwoord" id="lb-wachtwoord"></label>
      <input type="password" id="login-wachtwoord" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn primary" id="login-knop"></button>
    <p class="note" id="login-fout"></p>

    <div class="taal">
      <button type="button" id="lang-nl">NL</button>
      <button type="button" id="lang-ar">ع</button>
    </div>
  </form>
</div>

<script src="/login.js"></script>
</body>
</html>
