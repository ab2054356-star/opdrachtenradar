<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen — Opdrachtenradar</title>
<!-- PWA: ook hier, zodat de app installeerbaar is als je op het inlogscherm binnenkomt -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F1614">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Draaiende radarlaag. Bewust inline en niet in achtergrond.svg: een SVG die
     via CSS background-image geladen wordt, voert zijn animatie niet uit in
     Chrome. De stille laag (ringen, raster, netwerk) blijft wel een los
     bestand, want die is groter en wordt gecachet. -->
<svg class="radar" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="veeg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4FBFAC" stop-opacity=".34"/>
      <stop offset="60%"  stop-color="#4FBFAC" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#4FBFAC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7BE3CD" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#7BE3CD" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="schijf2"><circle cx="352" cy="800" r="880"/></clipPath>
  </defs>

  <g clip-path="url(#schijf2)">
    <g class="veeg">
      <path d="M352 800 L1223 678 A880 880 0 0 0 653 -27 Z" fill="url(#veeg)"/>
      <path d="M352 800 L653 -27" stroke="url(#rand)" stroke-width="2.5" fill="none"/>
    </g>

    <!-- ping: een ring die elke ronde naar buiten loopt -->
    <circle class="ping" cx="352" cy="800" r="150" fill="none" stroke="#4FBFAC" stroke-width="2"/>

    <!-- blips lichten op wanneer de straal er langs komt -->
    <g fill="#7BE3CD">
      <circle class="blip b1" cx="596" cy="470" r="7"/>
      <circle class="blip b2" cx="838" cy="676" r="5.5"/>
      <circle class="blip b3" cx="470" cy="266" r="5"/>
      <circle class="blip b4" cx="188" cy="512" r="4.5"/>
    </g>
  </g>
</svg>

<div class="loginwrap">
 <div class="podium">
<span class="persoon" aria-hidden="true">
    <svg viewBox="0 0 200 430" width="200" height="430">
      <defs>
        <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#2F9C8B"/>
          <stop offset="55%"  stop-color="#1E8AA0"/>
          <stop offset="100%" stop-color="#1E7FA8"/>
        </linearGradient>
        <linearGradient id="broek" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#22333C"/>
          <stop offset="100%" stop-color="#16242B"/>
        </linearGradient>
        <linearGradient id="haar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#3A2C24"/>
          <stop offset="100%" stop-color="#241B16"/>
        </linearGradient>
      </defs>
  
      <!-- schaduw op de grond -->
      <ellipse cx="104" cy="410" rx="52" ry="9" fill="#000" opacity=".28"/>
  
      <!-- Het hele lichaam helt naar rechts: hij leunt met zijn rug tegen de kaart. -->
      <g transform="rotate(7 100 404)">
  
        <!-- benen -->
        <path d="M82 244 L76 388 Q76 397 85 397 L97 397 Q104 397 103 388 L104 244 Z" fill="url(#broek)"/>
        <path d="M108 244 L118 384 Q120 394 129 393 L140 390 Q146 388 143 380 L122 244 Z" fill="url(#broek)"/>
        <ellipse cx="90"  cy="401" rx="19" ry="7.5" fill="#0F1A1F"/>
        <ellipse cx="137" cy="393" rx="19" ry="7.5" fill="#0F1A1F" transform="rotate(-8 137 393)"/>
  
        <!-- romp -->
        <path d="M70 126 Q100 114 130 126 L139 208 Q138 242 128 250 L72 250 Q62 242 61 208 Z" fill="url(#shirt)"/>
        <!-- kraag -->
        <path d="M86 120 Q100 133 114 120" stroke="#0E5F6E" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
  
        <!-- hangende armen -->
        <g class="arm-links">
          <path d="M72 134 L58 190" stroke="url(#shirt)" stroke-width="16" stroke-linecap="round" fill="none"/>
          <g class="onderarm-links">
            <path d="M58 190 L56 246" stroke="#E8B48C" stroke-width="13" stroke-linecap="round" fill="none"/>
            <circle cx="56" cy="252" r="9.5" fill="#E8B48C"/>
          </g>
        </g>
  
        <g class="arm-rechts">
          <path d="M128 134 L142 190" stroke="url(#shirt)" stroke-width="16" stroke-linecap="round" fill="none"/>
          <g class="onderarm-rechts">
            <path d="M142 190 L144 246" stroke="#E8B48C" stroke-width="13" stroke-linecap="round" fill="none"/>
            <g class="horloge">
              <rect x="135" y="222" width="18" height="5" rx="2.5" fill="#16242B"/>
              <rect x="136.5" y="214" width="15" height="14" rx="4" fill="#0F1A1F"/>
              <rect x="138.5" y="216" width="11" height="10" rx="2.5" fill="#4FBFAC" fill-opacity=".92"/>
            </g>
            <circle cx="144" cy="252" r="9.5" fill="#E8B48C"/>
          </g>
        </g>
  
        <!-- hoofd -->
        <g class="hoofd">
          <!-- nek -->
          <path d="M88 104 L112 104 L110 124 L90 124 Z" fill="#D2996F"/>
          <!-- oren -->
          <ellipse cx="70"  cy="80" rx="6.5" ry="9.5" fill="#E0A87F"/>
          <ellipse cx="130" cy="80" rx="6.5" ry="9.5" fill="#E0A87F"/>
          <!-- gezicht -->
          <ellipse cx="100" cy="76" rx="30" ry="33" fill="#E8B48C"/>
          <!-- haar met een lok -->
          <path d="M70 74 Q66 34 100 32 Q134 34 130 76 Q126 52 106 49 Q86 46 78 58 Q74 64 70 74 Z" fill="url(#haar)"/>
          <path d="M84 46 Q96 40 110 44" stroke="#4A382D" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
  
          <!-- wenkbrauwen -->
          <path d="M83 62 Q89 57 96 61" stroke="#2A211C" stroke-width="3.2" fill="none" stroke-linecap="round"/>
          <path d="M104 61 Q111 57 117 62" stroke="#2A211C" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  
          <!-- ogen -->
          <g class="ogen">
            <ellipse cx="89"  cy="75" rx="7" ry="5.4" fill="#FDFBF7"/>
            <ellipse cx="111" cy="75" rx="7" ry="5.4" fill="#FDFBF7"/>
            <circle cx="90"  cy="75" r="3.4" fill="#33566B"/>
            <circle cx="112" cy="75" r="3.4" fill="#33566B"/>
            <circle cx="90"  cy="75" r="1.7" fill="#101A1F"/>
            <circle cx="112" cy="75" r="1.7" fill="#101A1F"/>
            <circle cx="88.2" cy="73.2" r="1.1" fill="#fff"/>
            <circle cx="110.2" cy="73.2" r="1.1" fill="#fff"/>
          </g>
  
          <!-- neus -->
          <path d="M100 74 L97 88 Q100 91 105 89" stroke="#CE9269" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- mond -->
          <path class="mond" d="M91 97 Q100 104 109 97" stroke="#A5714C" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        </g>
  
        <!-- Dekarmen: apart getekend, allebei de handpalmen precies op de ogen. -->
        <g class="dekarm">
          <path d="M72 136 L52 112" stroke="url(#shirt)" stroke-width="16" stroke-linecap="round" fill="none"/>
          <path d="M52 112 L80 88"  stroke="#E8B48C"    stroke-width="13" stroke-linecap="round" fill="none"/>
          <path d="M128 136 L148 112" stroke="url(#shirt)" stroke-width="16" stroke-linecap="round" fill="none"/>
          <path d="M148 112 L120 88"  stroke="#E8B48C"    stroke-width="13" stroke-linecap="round" fill="none"/>
  
          <g transform="rotate(-8 88 74)">
            <rect x="70" y="60" width="36" height="30" rx="13" fill="#E8B48C"/>
            <path d="M80 65 L80 85 M89 64 L89 86 M97 65 L97 85" stroke="#D49B72" stroke-width="1.7" stroke-linecap="round" opacity=".85"/>
          </g>
          <g transform="rotate(8 112 74)">
            <rect x="94" y="60" width="36" height="30" rx="13" fill="#E8B48C"/>
            <path d="M103 65 L103 85 M111 64 L111 86 M120 65 L120 85" stroke="#D49B72" stroke-width="1.7" stroke-linecap="round" opacity=".85"/>
          </g>
        </g>
      </g>
    </svg>
  </span>

  <form class="logincard" id="loginform" autocomplete="on">

    <span class="eyebrow">ICT N3+N4 · klas C</span>
    <h1>Opdrachtenradar</h1>
    <p class="sub" id="login-sub"></p>

    <div class="veld">
      <label for="login-gebruiker" id="lb-gebruiker"></label>
      <input type="text" id="login-gebruiker" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>

    <div class="veld">
      <label for="login-wachtwoord" id="lb-wachtwoord"></label>
      <input type="password" id="login-wachtwoord" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn primary" id="login-knop"></button>
    <p class="note" id="login-fout"></p>

    <div class="taal">
      <button type="button" id="lang-nl">NL</button>
      <button type="button" id="lang-ar">ع</button>
    </div>
  </form>
 </div>
</div>

<script src="/login.js"></script>
</body>
</html>
