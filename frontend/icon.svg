<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Opdrachtenradar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Opdrachtenradar</title>
  <!--
    App-icoon. Eén vectorbestand voor alle maten: het blijft scherp op een
    telefoonscherm van 48 px en op een 512 px installatietegel.
    Dezelfde vormentaal als de inlogpagina: radarschijf, ringen, veegstraal.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#12201E"/>
      <stop offset="55%"  stop-color="#0F1614"/>
      <stop offset="100%" stop-color="#0B1512"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4FBFAC" stop-opacity=".85"/>
      <stop offset="70%"  stop-color="#4FBFAC" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#4FBFAC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="168"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g clip-path="url(#disc)">
    <circle cx="256" cy="256" r="168" fill="#0C1917"/>
    <path d="M256 256 L256 88 A168 168 0 0 1 424 256 Z" fill="url(#sweep)"/>
    <g fill="none" stroke="#4FBFAC" stroke-opacity=".30">
      <circle cx="256" cy="256" r="56"/>
      <circle cx="256" cy="256" r="112"/>
    </g>
    <g stroke="#4FBFAC" stroke-opacity=".18">
      <path d="M88 256 H424"/>
      <path d="M256 88 V424"/>
    </g>
    <path d="M256 256 L256 88" stroke="#7BE3CD" stroke-width="5" stroke-linecap="round"/>
  </g>

  <circle cx="256" cy="256" r="168" fill="none" stroke="#4FBFAC" stroke-opacity=".55" stroke-width="6"/>

  <!-- de blip die de radar heeft opgepikt: één opdracht -->
  <circle cx="330" cy="188" r="17" fill="#7BE3CD"/>
  <circle cx="330" cy="188" r="34" fill="none" stroke="#7BE3CD" stroke-opacity=".45" stroke-width="4"/>
  <circle cx="256" cy="256" r="12" fill="#7BE3CD"/>
</svg>
