<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Opdrachtenradar" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Opdrachtenradar (maskable)</title>
  <!--
    Maskable variant. Android knipt het icoon in een eigen vorm (cirkel,
    druppel, afgeronde vierkant). Alleen de binnenste 80% is gegarandeerd
    zichtbaar, dus staat de tekening hier kleiner en loopt de achtergrond
    helemaal door tot de rand.
  -->
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#12201E"/>
      <stop offset="55%"  stop-color="#0F1614"/>
      <stop offset="100%" stop-color="#0B1512"/>
    </linearGradient>
    <linearGradient id="sweepm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4FBFAC" stop-opacity=".85"/>
      <stop offset="70%"  stop-color="#4FBFAC" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#4FBFAC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="discm"><circle cx="256" cy="256" r="124"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bgm)"/>

  <g clip-path="url(#discm)">
    <circle cx="256" cy="256" r="124" fill="#0C1917"/>
    <path d="M256 256 L256 132 A124 124 0 0 1 380 256 Z" fill="url(#sweepm)"/>
    <g fill="none" stroke="#4FBFAC" stroke-opacity=".30">
      <circle cx="256" cy="256" r="42"/>
      <circle cx="256" cy="256" r="83"/>
    </g>
    <g stroke="#4FBFAC" stroke-opacity=".18">
      <path d="M132 256 H380"/>
      <path d="M256 132 V380"/>
    </g>
    <path d="M256 256 L256 132" stroke="#7BE3CD" stroke-width="4" stroke-linecap="round"/>
  </g>

  <circle cx="256" cy="256" r="124" fill="none" stroke="#4FBFAC" stroke-opacity=".55" stroke-width="5"/>

  <circle cx="311" cy="206" r="13" fill="#7BE3CD"/>
  <circle cx="311" cy="206" r="26" fill="none" stroke="#7BE3CD" stroke-opacity=".45" stroke-width="3"/>
  <circle cx="256" cy="256" r="9" fill="#7BE3CD"/>
</svg>
